  -webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh}
h1,h2,h3{letter-spacing:-.015em;margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 96px}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:6px}
.hide{display:none !important}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:rgba(13,16,20,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:900px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;gap:12px}
.ttl{font-size:19px;font-weight:700;line-height:1;letter-spacing:.14em}
.sub{font-size:11.5px;color:var(--mute);margin-top:4px}
.pill{margin-left:auto;font-family:'JetBrains Mono';font-size:11px;padding:6px 10px;border-radius:7px;
  border:1px solid var(--line);color:var(--mute);white-space:nowrap;background:var(--slab2)}
.pill b{color:var(--bone);font-weight:700}

/* tabs */
.tabs{position:sticky;top:65px;z-index:30;background:var(--void);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:900px;margin:0 auto;padding:0 8px;display:flex}
.tab{appearance:none;background:none;border:none;color:var(--mute);cursor:pointer;font-family:inherit;
  padding:13px 13px 11px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;
  border-bottom:1.5px solid transparent;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--bone)}
.tab.on{color:var(--bone);border-bottom-color:var(--signal)}
.tab svg{width:16px;height:16px}

/* panel */
.panel{background:var(--slab);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}
.panel-t{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;margin-bottom:4px}
.panel-t svg{width:17px;height:17px;color:var(--steel)}
.muted{color:var(--mute);font-size:13.5px;margin:0}
.hint{color:var(--mute2);font-size:12px}
.divider{height:1px;background:var(--line2);margin:16px 0}

/* hero */
.hero{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:14px;
  display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.gauge-box{flex:none;text-align:center}
.gauge-note{font-family:'JetBrains Mono';font-size:42px;font-weight:700;line-height:1;letter-spacing:-.03em}
.gauge-cap{font-size:10.5px;color:var(--mute2);letter-spacing:.1em;margin-top:4px}
.hero-body{flex:1;min-width:220px}
.hero-body h1{font-size:20px;font-weight:700}
.verdict{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  padding:5px 11px;border-radius:7px;margin-bottom:9px}
.verdict svg{width:15px;height:15px}
.v-ok{background:rgba(91,192,140,.14);color:var(--ok)}
.v-mid{background:rgba(185,201,217,.12);color:var(--steel)}
.v-bad{background:rgba(255,107,94,.13);color:var(--bad)}
.v-none{background:rgba(255,255,255,.05);color:var(--mute)}

/* probe rows */
.probe{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.probe:last-child{border-bottom:none}
.probe-ic{width:32px;height:32px;border-radius:7px;background:var(--slab2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--steel);flex:none}
.probe-ic svg{width:16px;height:16px}
.probe-name{font-weight:600;font-size:14px}
.probe-meta{font-size:12px;color:var(--mute)}
.probe-val{margin-left:auto;display:flex;align-items:center;gap:8px}
.probe-num{font-family:'JetBrains Mono';font-size:15px;font-weight:500}
.nbadge{display:inline-block;min-width:28px;text-align:center;font-family:'JetBrains Mono';
  font-weight:700;font-size:13px;padding:4px 7px;border-radius:6px;background:var(--slab2);
  border:1px solid var(--line)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.tbl th,.tbl td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line2)}
.tbl th{color:var(--mute2);font-weight:500;font-size:11px}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl td{font-family:'JetBrains Mono';font-size:12.5px}
.tbl tr.hl td{background:rgba(185,201,217,.05)}
.tbl tr.top td{background:rgba(255,59,47,.07)}
.tbl .n{font-weight:700;color:var(--bone)}
.scroll-x{overflow-x:auto}

/* accordion */
.acc{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;background:var(--slab)}
.acc-h{width:100%;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:14px;text-align:left}
.acc-num{font-family:'JetBrains Mono';font-weight:700;font-size:13px;color:var(--mute);
  width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--slab2);
  display:grid;place-items:center;flex:none;transition:.2s}
.acc.open .acc-num{background:var(--bone);color:var(--void);border-color:transparent}
.acc-ttl{font-weight:600;font-size:15px}
.acc-wk{font-size:12px;color:var(--mute);margin-top:2px}
.acc-chev{margin-left:auto;color:var(--mute2);transition:transform .3s;width:20px;height:20px;flex:none}
.acc.open .acc-chev{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .38s ease}
.acc.open .acc-body{max-height:2000px}
.acc-inner{padding:0 18px 18px 58px}
.wk{padding:11px 0;border-top:1px solid var(--line2)}
.wk-d{font-weight:600;font-size:13.5px}
.wk-p{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.5}

/* inputs / buttons */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--mute);font-weight:500}
.inp{background:var(--slab2);border:1px solid var(--line);border-radius:8px;color:var(--bone);
  font-family:'JetBrains Mono',monospace;font-size:16px;padding:10px 12px;width:100%;outline:none}
.inp:focus{border-color:var(--steel)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{appearance:none;border:1px solid var(--line);background:var(--slab2);color:var(--bone);
  font-family:inherit;font-weight:600;font-size:13.5px;padding:10px 14px;border-radius:8px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:hover{border-color:var(--steel)}
.btn.solid{background:var(--bone);color:var(--void);border-color:transparent}
.btn.solid:hover{background:#fff}
.btn.ghost{background:none}
.btn svg{width:16px;height:16px}
.btn.sm{padding:5px 8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--slab2);color:var(--mute);
  font-family:inherit;font-size:12.5px;padding:7px 11px;border-radius:7px;cursor:pointer;transition:.15s}
.chip:hover{color:var(--bone)}
.chip.on{background:var(--bone);color:var(--void);border-color:transparent;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* timer */
.ring-wrap{position:relative;width:230px;height:230px;margin:10px auto 2px}
.ring-wrap .inner{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.phase-tag{font-size:11px;font-weight:700;letter-spacing:.18em}
.timer-num{font-family:'JetBrains Mono';font-size:54px;font-weight:500;line-height:1;margin:3px 0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--slab2);border:1px solid var(--line);border-radius:9px;padding:13px}
.stat .k{font-size:11px;color:var(--mute2)}
.stat .v{font-family:'JetBrains Mono';font-size:22px;font-weight:500;margin-top:4px}
.stat .v small{font-size:12px;color:var(--mute);font-weight:400}

/* method */
.method{border-left:1.5px solid var(--signal);padding:2px 0 2px 16px;margin-top:20px}
.method h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.method h3 svg{width:16px;height:16px;color:var(--steel)}
.method p{font-size:13.5px;color:var(--mute);margin:8px 0 0;line-height:1.6}
.method .src{font-size:11px;color:var(--mute2);margin-top:9px}
.klist{list-style:none;padding:0;margin:9px 0 0}
.klist li{font-size:13.5px;padding:5px 0 5px 18px;position:relative}
.klist li:before{content:'';position:absolute;left:0;top:12px;width:7px;height:1.5px;background:var(--steel)}

/* sets + callout */
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.setpill{background:var(--slab2);border:1px solid var(--line);border-radius:7px;padding:8px 12px;
  font-family:'JetBrains Mono';font-weight:500;font-size:14px;display:flex;align-items:center;gap:9px}
.setpill button{appearance:none;border:none;background:none;color:var(--mute2);cursor:pointer;
  display:grid;place-items:center;padding:0}
.setpill button:hover{color:var(--bad)}
.setpill svg{width:14px;height:14px}
.callout{background:var(--slab2);border:1px solid var(--line);border-left:2px solid var(--bad);
  border-radius:10px;padding:14px 16px;margin-top:16px;display:flex;gap:11px}
.callout svg{width:17px;height:17px;color:var(--bad);flex:none;margin-top:2px}
.callout .ct{font-size:13.5px;color:var(--mute);line-height:1.55}
.callout b{color:var(--bone);font-weight:600}
.callout.good{border-left-color:var(--ok)}
.callout.good svg{color:var(--ok)}

/* workout */
.wprog{margin-top:16px}
.wprog-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;
  color:var(--mute);margin-bottom:6px}
.wbar{height:4px;border-radius:2px;background:var(--slab2);overflow:hidden}
.wbar > i{display:block;height:100%;background:var(--signal);border-radius:2px;
  transition:width .5s cubic-bezier(.2,.7,.2,1)}
.dgrid{display:grid;gap:10px;margin-top:14px}
.dcard{background:var(--slab);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  transition:border-color .2s}
.dcard.today{border-color:rgba(255,59,47,.42)}
.dcard.is-rest{opacity:.6}
.dcard.open{border-color:var(--line)}
.dcard-h{width:100%;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:13px;text-align:left}
.dring{width:32px;height:32px;flex:none}
.dring-t{fill:var(--mute);font-size:11px;font-family:'JetBrains Mono';font-weight:700}
.dcard-b{flex:1;min-width:0;display:block}
.dcard-day{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px}
.dcard-day em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  background:var(--signal);color:#fff;padding:2px 6px;border-radius:4px}
.dcard-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}
.dcard-date{font-family:'JetBrains Mono';font-size:11px;color:var(--mute2)}
.dcard-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.dcard.open .dcard-body{max-height:800px}
.ex-list{padding:0 16px 8px 16px;border-top:1px solid var(--line2);margin-top:2px}
.ex{width:100%;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;display:flex;align-items:flex-start;gap:12px;padding:11px 0;text-align:left;
  border-bottom:1px solid var(--line2)}
.ex:last-child{border-bottom:none}
.ex-box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);background:var(--slab2);
  flex:none;display:grid;place-items:center;margin-top:1px;transition:.15s;color:var(--void)}
.ex-box svg{width:13px;height:13px;stroke-width:3}
.ex.on .ex-box{background:var(--ok);border-color:transparent}
.ex-b{display:block;min-width:0}
.ex-n{display:block;font-size:13.5px;font-weight:500;transition:.15s}
.ex.on .ex-n{color:var(--mute2);text-decoration:line-through}
.ex-d{display:block;font-family:'JetBrains Mono';font-size:11.5px;color:var(--mute);margin-top:3px}
.ex.on .ex-d{color:var(--mute2)}
.wtag{display:inline-block;font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px;white-space:nowrap}
.wtag.hard{background:rgba(255,59,47,.13);color:#ff8478}
.wtag.easy{background:rgba(91,192,140,.13);color:var(--ok)}
.wtag.power{background:rgba(185,201,217,.14);color:var(--steel)}
.wtag.cal{background:rgba(196,164,232,.14);color:#c9aeee}
.wtag.rest{background:rgba(255,255,255,.04);color:var(--mute2)}
.wfoot{font-size:12.5px;color:var(--mute);line-height:1.6}
.wfoot b{color:var(--bone);font-weight:600}

/* jurnal */
.wo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.wo-btn{appearance:none;border:1px solid var(--line);background:var(--slab2);color:var(--bone);
  font-family:inherit;font-size:13.5px;font-weight:500;padding:14px 12px;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;gap:10px;text-align:left;transition:.15s}
.wo-btn:hover{border-color:var(--steel)}
.wo-btn:active{transform:scale(.98)}
.wo-btn svg{width:17px;height:17px;color:var(--steel);flex:none}
.strip{display:flex;gap:6px;margin-top:16px}
.strip .day{flex:1;text-align:center}
.strip .dot{width:100%;aspect-ratio:1;max-width:38px;margin:0 auto 5px;border-radius:7px;
  background:var(--slab2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute2)}
.strip .dot.on{background:var(--bone);border-color:transparent;color:var(--void)}
.strip .dot svg{width:16px;height:16px}
.strip .dl{font-size:10px;color:var(--mute2)}
.entry{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2)}
.entry:last-child{border-bottom:none}
.entry-ic{width:30px;height:30px;border-radius:7px;background:var(--slab2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--steel);flex:none}
.entry-ic svg{width:15px;height:15px}
.entry-b{flex:1;min-width:0}
.entry-t{font-size:13.5px;font-weight:600}
.entry-note{background:none;border:none;border-bottom:1px solid var(--line);color:var(--mute);
  font-family:'JetBrains Mono';font-size:12px;padding:4px 0;width:100%;outline:none;margin-top:3px}
.entry-note:focus{border-bottom-color:var(--steel);color:var(--bone)}
.entry-note::placeholder{color:var(--mute2)}
.daygroup{margin-top:16px}
.daygroup-h{font-family:'JetBrains Mono';font-size:11px;color:var(--mute2);margin-bottom:2px}

/* chart */
.chart{width:100%;height:auto;display:block;margin-top:14px}
.chart .grid{stroke:rgba(185,201,217,.07);stroke-width:1}
.chart .axis{fill:#8A97A6;font-size:10px;font-family:'JetBrains Mono'}
.chart .tline{stroke:var(--signal);stroke-width:1;stroke-dasharray:3 4}
.chart .tlabel{fill:var(--signal);font-size:10px;font-family:'JetBrains Mono'}
.chart .path{fill:none;stroke:var(--steel);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--signal)}

/* intro — blocaj de reticul */
.intro{position:fixed;inset:0;z-index:100;background:var(--void);display:grid;place-items:center;
  padding:24px;cursor:pointer}
.intro.out{animation:introOut .45s cubic-bezier(.4,0,.2,1) forwards}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.intro-c{text-align:center}
.reticle{width:150px;height:150px;margin:0 auto;display:block;overflow:visible}
.rt-br{opacity:0;animation:brIn .6s cubic-bezier(.2,.9,.25,1) forwards}
.rt-br.a{--dx:-16px;--dy:-16px;animation-delay:.05s}
.rt-br.b{--dx:16px;--dy:-16px;animation-delay:.13s}
.rt-br.c{--dx:-16px;--dy:16px;animation-delay:.21s}
.rt-br.d{--dx:16px;--dy:16px;animation-delay:.29s}
@keyframes brIn{
  from{opacity:0;transform:translate(var(--dx),var(--dy))}
  60%{opacity:1}
  to{opacity:1;transform:translate(0,0)}}
.rt-cross{opacity:0;animation:crossIn .35s ease .5s forwards}
@keyframes crossIn{to{opacity:1}}
.rt-scan{opacity:0;animation:scanDown .75s cubic-bezier(.4,0,.3,1) .58s forwards}
@keyframes scanDown{
  0%{opacity:0;transform:translateY(-34px)}
  25%{opacity:1}
  75%{opacity:1}
  100%{opacity:0;transform:translateY(34px)}}
.rt-mark{opacity:0;transform-origin:50% 50%;animation:markIn .5s cubic-bezier(.2,1.1,.3,1) .78s forwards}
@keyframes markIn{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
.rt-lock{opacity:0;animation:lockFlash .5s ease 1.16s forwards}
@keyframes lockFlash{0%{opacity:0}30%{opacity:1}100%{opacity:.55}}
.intro-word{font-size:34px;font-weight:700;letter-spacing:.32em;text-indent:.32em;margin-top:22px;
  opacity:0;animation:wordIn .5s cubic-bezier(.2,.8,.2,1) 1.2s forwards}
@keyframes wordIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.intro-sub{font-size:10.5px;color:var(--mute);margin-top:10px;letter-spacing:.24em;
  opacity:0;animation:wordIn .5s ease 1.38s forwards}
.intro-skip{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-size:11px;
  color:var(--mute2);opacity:0;animation:crossIn .5s ease 1.9s forwards}
.topbar .mk-dial{stroke-dashoffset:0}
.topbar .mk-needle{transform:none}
.topbar .mk-tick{opacity:1}

/* dock — cronometre live */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(13,16,20,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  animation:dockUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes dockUp{from{transform:translateY(100%)}to{transform:none}}
.dock-in{max-width:900px;margin:0 auto;padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px}
.dock-blk{display:flex;align-items:center;gap:10px;min-width:0}
.dock-ring{width:38px;height:38px;flex:none}
.dock-k{font-size:10px;color:var(--mute2);letter-spacing:.08em}
.dock-v{font-family:'JetBrains Mono';font-size:20px;font-weight:500;line-height:1.15}
.dock-v.rest{color:var(--signal)}
.dock-sep{width:1px;align-self:stretch;background:var(--line)}
.dock-acts{margin-left:auto;display:flex;gap:8px;flex:none}
body.has-dock .wrap{padding-bottom:150px}

/* buton pauză pe exercițiu */
.ex{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.ex:last-child{border-bottom:none}
.ex-tick{flex:1;min-width:0;appearance:none;border:none;background:none;color:inherit;
  font-family:inherit;cursor:pointer;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:0}
.ex-rest{appearance:none;border:1px solid var(--line);background:var(--slab2);color:var(--mute);
  font-family:'JetBrains Mono';font-size:11px;font-weight:500;padding:5px 8px;border-radius:6px;
  cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:5px;transition:.15s;margin-top:1px}
.ex-rest:hover{border-color:var(--signal);color:var(--signal)}
.ex-rest svg{width:12px;height:12px}
.ex-rest.live{background:var(--signal);color:#fff;border-color:transparent}
.sess-bar{display:flex;align-items:center;gap:10px;padding:12px 0 4px;flex-wrap:wrap}

.count{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulsing{animation:pulse 1s ease-in-out infinite}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){
  .intro-word,.intro-sub,.intro-cnt,.intro-skip{animation:none;opacity:1}
  .mk-dial{stroke-dashoffset:0}
  .intro .mk-dial,.intro .mk-needle,.intro .mk-tick{animation:none}
  .mk-needle{transform:none}.mk-tick{opacity:1}
  .fade,.count,.pulsing{animation:none}
}
@media(max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
  .gauge-note{font-size:36px}
  .ttl{font-size:17px}
  .intro-word{font-size:30px}
  .wo-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

/* ---------- stocare (window.storage → localStorage → memorie) ---------- */
const store={
  _mem:{},
  async get(k){
    try{ if(window.storage&&window.storage.get){const r=await window.storage.get(k,false);return r?JSON.parse(r.value):null;} }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){}
    return this._mem[k]!==undefined?this._mem[k]:null;
  },
  async set(k,v){
    this._mem[k]=v;
    try{ if(window.storage&&window.storage.set){await window.storage.set(k,JSON.stringify(v),false);return;} }catch(e){}
    try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
  }
};

/* ---------- vizualizări ---------- */
function gaugeSVG(avg){
  const R=52,C=Math.PI*R;
  const frac=avg==null?0:Math.max(0,Math.min(1,avg/10));
  const col=avg==null?'var(--mute2)':avg>=9.995?'var(--ok)':avg>=9?'var(--steel)':'var(--bad)';
  const ang=-90+frac*180;
  let ticks='';
  for(let i=0;i<=10;i++){
    const a=(-90+i*18)*Math.PI/180, major=(i===9||i===10), r1=major?40:45, r2=52;
    ticks+=`<line x1="${(65+r1*Math.sin(a)).toFixed(2)}" y1="${(68-r1*Math.cos(a)).toFixed(2)}"
      x2="${(65+r2*Math.sin(a)).toFixed(2)}" y2="${(68-r2*Math.cos(a)).toFixed(2)}"
      stroke="${i===10?'var(--signal)':'rgba(185,201,217,.28)'}" stroke-width="${major?1.6:1}"/>`;
  }
  return `<div class="gauge-box">
    <svg width="150" height="88" viewBox="0 0 130 76" aria-hidden="true">
      <path d="M12 68 A53 53 0 0 1 118 68" fill="none" stroke="rgba(185,201,217,.1)" stroke-width="2"/>
      <path d="M12 68 A53 53 0 0 1 118 68" fill="none" stroke="${col}" stroke-width="2"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/>
      ${ticks}
      <g transform="rotate(${ang} 65 68)"><line x1="65" y1="68" x2="65" y2="26"
        stroke="${col}" stroke-width="2.4" stroke-linecap="round"/></g>
      <circle cx="65" cy="68" r="3.4" fill="var(--slab)" stroke="${col}" stroke-width="1.6"/>
    </svg>
    <div class="gauge-note mono" style="color:${col}">${avg==null?'—.—':avg.toFixed(2)}</div>
    <div class="gauge-cap">medie · maxim 10.00</div>
  </div>`;
}

function badge(n){
  if(n==null) return `<span class="nbadge" style="color:var(--mute2)">—</span>`;
  const c=n>=10?'var(--signal)':n>=9?'var(--ok)':n>=7?'var(--steel)':'var(--bad)';
  return `<span class="nbadge count" style="color:${c}">${n}</span>`;
}

function lineChart(pts,{target,reversed,fmt,labels}){
  if(!pts.length) return '';
  const W=680,H=220,ml=52,mr=14,mt=14,mb=28;
  const vals=pts.concat([target]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi===lo){hi+=1;lo-=1;}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const x=i=>ml+(pts.length===1?(W-ml-mr)/2:i*(W-ml-mr)/(pts.length-1));
  const y=v=>{const f=(v-lo)/(hi-lo);return reversed?mt+f*(H-mt-mb):H-mb-f*(H-mt-mb);};
  let grid='',axis='';
  for(let i=0;i<=3;i++){
    const v=lo+(hi-lo)*i/3, yy=y(v);
    grid+=`<line class="grid" x1="${ml}" y1="${yy.toFixed(1)}" x2="${W-mr}" y2="${yy.toFixed(1)}"/>`;
    axis+=`<text class="axis" x="${ml-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  }
  const d=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const dots=pts.map((v,i)=>`<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3"/>`).join('');
  const xl=labels.map((l,i)=>`<text class="axis" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`).join('');
  const ty=y(target);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:210px">
    ${grid}${axis}
    <line class="tline" x1="${ml}" y1="${ty.toFixed(1)}" x2="${W-mr}" y2="${ty.toFixed(1)}"/>
    <text class="tlabel" x="${W-mr}" y="${(ty-6).toFixed(1)}" text-anchor="end">nota 10</text>
    <path class="path" d="${d}"/>${dots}${xl}
  </svg>`;
}

  return `<div class="fade">
    <div class="hero">${gaugeSVG(avg)}

        <b>10 la toate</b>: 50m 6.8s, 1000m 3:20, 14 tracțiuni. Antrenează-te cu marjă ca să atingi 10 sigur în ziua probei.</p>

      <tbody>${tb}</tbody></table></div>

    <div class="callout good">${ic('flame')}<div class="ct"><b>Ești full-focus pe probe.</b>

function mondayOf(k){ const d=new Date(k+'T00:00'); const off=(d.getDay()+6)%7; return dayShift(k,-off); }
function exId(b,d,x){ return 'b'+b+'d'+d+'e'+x; }
function dayDone(dateK,b,di,day){
  const log=(S.wlog||{})[dateK]||{};
  let n=0; day.ex.forEach((_,x)=>{ if(log[exId(b,di,x)]) n++; });
  return n;
}

function viewWorkout(){
  const b=S.weekBlock, days=WEEK[b], tk=todayKey(), mon=mondayOf(tk);
  const dates=Array.from({length:7},(_,i)=>dayShift(mon,i));
  const todayIdx=dates.indexOf(tk);
  let totDone=0, totAll=0;
  days.forEach((d,i)=>{ if(d.k!=='rest'){ totAll+=d.ex.length; totDone+=dayDone(dates[i],b,i,d); } });
  const pct=totAll?Math.round(totDone/totAll*100):0;

  const chips=WEEK_META.map((m,i)=>`<button class="chip ${b===i?'on':''}" data-act="wblock" data-i="${i}">${m[0]}</button>`).join('');

  const cards=days.map((d,i)=>{
    const dk=dates[i], done=dayDone(dk,b,i,d), tot=d.ex.length;
    const isToday=dk===tk, open=S.openDay===i, full=done===tot&&tot>0;
    const R=13,C=2*Math.PI*R, frac=tot?done/tot:0;
    const ring=`<svg class="dring" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="${R}" fill="none" stroke="rgba(185,201,217,.14)" stroke-width="3"/>
      <circle cx="16" cy="16" r="${R}" fill="none" stroke="${full?'var(--ok)':'var(--signal)'}" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"
        transform="rotate(-90 16 16)"/>
      ${full?`<path d="M11 16l3.5 3.5L21 13" fill="none" stroke="var(--ok)" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>`
        :`<text x="16" y="20" text-anchor="middle" class="dring-t">${done}</text>`}</svg>`;
    const rows=d.ex.map((e,x)=>{
      const id=exId(b,i,x), on=((S.wlog||{})[dk]||{})[id];
      const rs=parseRest(e[1],e[0]);
      const live=S.rest&&S.rest.label===id;
      const restBtn=rs?`<button class="ex-rest ${live?'live':''}" data-act="rest" data-r="${rs}" data-x="${id}"
        title="Pornește pauza">${ic('timer')} ${fmtTime(rs)}</button>`:'';
      return `<div class="ex ${on?'on':''}">
        <button class="ex-tick" data-act="ex" data-k="${dk}" data-x="${id}">
          <span class="ex-box">${on?ic('check'):''}</span>
          <span class="ex-b"><span class="ex-n">${esc(e[0])}</span><span class="ex-d">${esc(e[1])}</span></span>
        </button>${restBtn}
      </div>`;}).join('');
    return `<article class="dcard ${open?'open':''} ${isToday?'today':''} ${d.k==='rest'?'is-rest':''}">
      <button class="dcard-h" data-act="openday" data-i="${i}">
        ${ring}
        <span class="dcard-b">
          <span class="dcard-day">${d.d}${isToday?'<em>azi</em>':''}</span>
          <span class="dcard-meta"><span class="wtag ${d.k}">${d.tag}</span>
            <span class="dcard-date">${shortDate(dk)} · ${done}/${tot}</span></span>
        </span>
        ${ic('chev','acc-chev')}
      </button>
      <div class="dcard-body"><div class="ex-list">
        ${d.k==='rest'?'':`<div class="sess-bar">
          ${(S.sess&&S.sess.date===dk)
            ? `<button class="btn solid sm" data-act="sessStop">${ic('pause')} Termină antrenamentul</button>

            : `<button class="btn sm" data-act="sessStart" data-k="${dk}">${ic('play')} Începe antrenamentul</button>`}
          ${((S.wlog||{})[dk]||{}).__min?`<span class="hint">ultima durată: ${((S.wlog||{})[dk]||{}).__min} min</span>`:''}
        </div>`}
        ${rows}</div></div>
    </article>`;}).join('');

  return `<div class="fade">
    <div class="panel">
      <div class="panel-t">${ic('dumbbell')} Workout — săptămâna curentă</div>
      <p class="muted">Bifezi fiecare exercițiu pe măsură ce îl termini. Progresul se salvează pe data reală a zilei.
      Cu ture rotative contează <b>ordinea și spațierea</b>, nu ziua din calendar: ține ~48h între alergările tari.</p>
      <div class="chips" style="margin-top:12px">${chips}</div>
      <div class="wprog">
        <div class="wprog-h"><span>${shortDate(mon)} – ${shortDate(dates[6])}</span>

        <div class="wbar"><i style="width:${pct}%"></i></div>

    </div>
    <button class="btn solid" data-act="gtgadd" style="margin-top:14px;width:100%">${ic('plus')} Adaugă serie (${gtarget} rep)</button>
    ${gtoday.length?`<div class="sets">${gtoday.map((r,i)=>`<div class="setpill">${r}
      <button data-act="gtgdel" data-i="${i}" aria-label="Șterge seria">${ic('trash')}</button></div>`).join('')}</div>`:''}
    <div class="hint" style="margin-top:12px">Ținta: 50% din maxim, 5–8 serii pe zi la 30–60 min distanță. Plafon ~35–50 rep/zi.</div>`:''}
  </div>

  </div>`;
}

function viewProgress(){
  const conf={
    run:{label:'1000m',target:RUN[10],fmt:fmtTime,reversed:true,key:'run',hint:'nota 10 = 3:20 — mai jos e mai bine'},
    sprint:{label:'50m',target:SPRINT[10],fmt:v=>v.toFixed(1),reversed:true,key:'sprint',hint:'nota 10 = 6.8s — mai jos e mai bine'},
    pull:{label:'Tracțiuni',target:PULL[10],fmt:v=>Math.round(v)+'',reversed:false,key:'pull',hint:'nota 10 = 14 rep — mai sus e mai bine'}
  }[S.metric];
  const rows=S.tests.filter(t=>t[conf.key]!=null);
  const chart=rows.length?lineChart(rows.map(t=>t[conf.key]),
    {target:conf.target,reversed:conf.reversed,fmt:conf.fmt,labels:rows.map(t=>shortDate(t.date))})
    :`<p class="muted" style="margin-top:16px">Niciun rezultat încă pentru ${conf.label}. Adaugă un test mai sus ca să pornească graficul.</p>`;
  const hist=S.tests.length?`<div class="panel"><div class="panel-t">${ic('list')} Istoric teste</div>
    <table class="tbl"><thead><tr><th>Data</th><th>1000m</th><th>50m</th><th>Tracț.</th><th></th></tr></thead><tbody>
    ${S.tests.map((t,i)=>({t,i})).reverse().map(({t,i})=>`<tr><td>${shortDate(t.date)}</td>
      <td>${t.run?fmtTime(t.run):'—'}</td><td>${t.sprint!=null?t.sprint:'—'}</td><td>${t.pull!=null?t.pull:'—'}</td>
      <td><button class="btn ghost sm" data-act="delTest" data-i="${i}">${ic('trash')}</button></td></tr>`).join('')}
    </tbody></table></div>`:'';
  return `<div class="fade">
    <div class="panel"><div class="panel-t">${ic('plus')} Adaugă un test (${shortDate(todayKey())})</div>
      <div class="grid2" style="margin-top:12px">
        <div class="field"><label>1000m (min : sec)</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input class="inp" type="number" inputmode="numeric" id="tM" placeholder="4">
            <span class="mono" style="font-size:20px">:</span>
            <input class="inp" type="number" inputmode="numeric" id="tS" placeholder="00">
          </div></div>
        <div class="field"><label>50m (sec)</label>
          <input class="inp" type="number" inputmode="decimal" step="0.1" id="tSp" placeholder="7.0"></div>
        <div class="field"><label>Tracțiuni (rep)</label>
          <input class="inp" type="number" inputmode="numeric" id="tPu" placeholder="11"></div>
        <div class="field" style="justify-content:flex-end">
          <button class="btn solid" data-act="addTest">${ic('plus')} Salvează testul</button></div>
      </div>
      <div class="hint" style="margin-top:8px">Completează doar câmpurile testate azi. Datele se salvează automat.</div>
    </div>
    <div class="panel"><div class="panel-t">${ic('trend')} Evoluție</div>
      <div class="chips" style="margin-top:8px">
        ${[['run','1000m'],['sprint','50m'],['pull','Tracțiuni']].map(m=>
          `<button class="chip ${S.metric===m[0]?'on':''}" data-act="metric" data-k="${m[0]}">${m[1]}</button>`).join('')}
      </div>${chart}
      ${rows.length?`<div class="hint">${conf.hint}</div>`:''}
    </div>${hist}</div>`;
}

function viewJurnal(){
  const w=S.workouts||{}, entries=w.entries||[], tk=todayKey();
  const dset=new Set(entries.map(e=>e.date));
  let streak=0, d=tk; while(dset.has(d)){streak++;d=dayShift(d,-1);}
  const weekStart=dayShift(tk,-6);
  const weekCount=entries.filter(e=>e.date>=weekStart).length;
  const strip=Array.from({length:7},(_,i)=>{const k=dayShift(tk,-(6-i));
    return {on:dset.has(k),dl:new Date(k+'T00:00').toLocaleDateString('ro-RO',{weekday:'short'}).replace('.','')};});
  const today=entries.filter(e=>e.date===tk);
  const byDate={}; entries.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  const dates=Object.keys(byDate).filter(x=>x!==tk).sort().reverse();
  const row=(e,editable)=>{const s=SESSMAP[e.sid]||['','Sesiune','activity'];
    return `<div class="entry"><div class="entry-ic">${ic(s[2])}</div>
      <div class="entry-b"><div class="entry-t">${esc(s[1])}</div>
      ${editable?`<input class="entry-note" value="${esc(e.note)}" placeholder="notează detalii (opțional)" data-note="${e.eid}">`
        :(e.note?`<div class="hint mono" style="margin-top:2px">${esc(e.note)}</div>`:'')}</div>
      <button class="btn ghost sm" data-act="delWo" data-k="${e.eid}">${ic('trash')}</button></div>`;};
  return `<div class="fade">
    <div class="panel"><div class="panel-t">${ic('calCheck')} Jurnal antrenamente</div>
      <p class="muted">Bifează sesiunea când o termini și notează ce ai făcut efectiv (ex. „6×400 @ 1:23").</p>
      <div class="wo-grid">${SESSIONS.map(s=>`<button class="wo-btn" data-act="logWo" data-k="${s[0]}">${ic(s[2])} ${s[1]}</button>`).join('')}</div>
    </div>
    <div class="panel">
      <div class="stats" style="margin-top:0">
        <div class="stat"><div class="k">Serie</div><div class="v">${streak} <small>${streak===1?'zi':'zile'}</small></div></div>
        <div class="stat"><div class="k">Săptămâna asta</div><div class="v">${weekCount}</div></div>
        <div class="stat"><div class="k">Total</div><div class="v">${entries.length}</div></div>
      </div>
      <div class="strip">${strip.map(s=>`<div class="day"><div class="dot ${s.on?'on':''}">${s.on?ic('check'):''}</div>
        <div class="dl">${s.dl}</div></div>`).join('')}</div>
    </div>
    ${today.length?`<div class="panel"><div class="panel-t">${ic('flame')} Azi · ${today.length}</div>
      ${today.map(e=>row(e,true)).join('')}</div>`:''}
    ${dates.length?`<div class="panel"><div class="panel-t">${ic('list')} Istoric</div>
      ${dates.map(dk=>`<div class="daygroup"><div class="daygroup-h">${shortDate(dk)}</div>
        ${byDate[dk].map(e=>row(e,false)).join('')}</div>`).join('')}</div>`:''}
    ${entries.length?'':`<div class="panel"><p class="muted">Niciun antrenament încă. Apasă o sesiune de mai sus ca s-o adaugi în ziua de azi.</p></div>`}
  </div>`;
}

const VIEWS={brief:viewBrief,program:viewProgram,workout:viewWorkout,tools:viewTools,
  methods:viewMethods,progress:viewProgress,jurnal:viewJurnal};

/* ---------- pauze & cronometru de sesiune ---------- */
function parseRest(detail,name){
  const t=(detail||'').toLowerCase();
  let m=t.match(/pauz[ăa]\s*(?:activ[ăa]\s*)?(\d+)\s*min/);      if(m) return +m[1]*60;
  m=t.match(/pauz[ăa]\s*(?:de\s*)?(\d+)\s*[–-]?\s*(\d+)?\s*s/); if(m) return +m[1];
  m=t.match(/pauz[ăa]\s*(\d+):(\d+)/);                            if(m) return +m[1]*60+ +m[2];
  if(/pauz[ăa]\s*complet|recuperare complet/.test(t)) return 240;
  const n=(name||'').toLowerCase();
  if(/încălzire|incalzire|cool-down|mobilitate|somn|mers|drill|notează/.test(n)) return 0;
  if(/tracțiuni cu greutate|negative|hip thrust|ramat|sanie/.test(n)) return 180;
  if(/accelerații|starturi|flying|50m|sprint/.test(n)) return 240;
  if(/maxim|la eșec|test/.test(n)) return 180;
  if(/gtg|submaximal/.test(n)) return 0;
  if(/flotări|dips|core|plank|hollow|picioare|abdomene|priză|prosop|atârnat|farmer|pogo|bounding|pliometrie|strides|dealuri/.test(n)) return 90;
  return 120;
}
function startRest(sec,label){
  if(!sec) return;
  unlockAudio();
  S.rest={left:sec,total:sec,label:label||''};
  ensureDock(); paintDock();
}
function unlockAudio(){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
       if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
}
function sessElapsed(){ return S.sess? Math.max(0,Math.floor((Date.now()-S.sess.start)/1000)) : 0; }
function ensureDock(){
  document.body.classList.toggle('has-dock',!!(S.sess||S.rest));
  let d=document.getElementById('dock');
  if(!(S.sess||S.rest)){ if(d) d.remove(); stopDock(); return; }
  if(!d){ d=document.createElement('div'); d.className='dock'; d.id='dock'; document.body.appendChild(d); }
  if(!dockHandle) dockHandle=setInterval(dockTick,1000);
}
function stopDock(){ if(dockHandle){clearInterval(dockHandle);dockHandle=null;} }
function dockTick(){
  const si=document.getElementById('sessInline'); if(si&&S.sess) si.textContent=fmtTime(sessElapsed());
  if(S.rest){
    S.rest.left--;
    if(S.rest.left<=3&&S.rest.left>0) beep(880,.06);
    if(S.rest.left<=0){ beep(1320,.14); setTimeout(()=>beep(1320,.14),190); S.rest=null; ensureDock(); }
  }
  paintDock();
}
function paintDock(){
  const d=document.getElementById('dock'); if(!d) return;
  const R=16,C=2*Math.PI*R;
  let html='<div class="dock-in">';
  if(S.sess){
    html+=`<div class="dock-blk">${ic('timer')}<div>
      <div class="dock-k">ANTRENAMENT</div>
      <div class="dock-v mono">${fmtTime(sessElapsed())}</div></div></div>`;
  }
  if(S.rest){
    if(S.sess) html+='<div class="dock-sep"></div>';
    const frac=S.rest.left/S.rest.total;
    html+=`<div class="dock-blk">
      <svg class="dock-ring" viewBox="0 0 38 38" aria-hidden="true">
        <circle cx="19" cy="19" r="${R}" fill="none" stroke="rgba(185,201,217,.14)" stroke-width="3"/>
        <circle cx="19" cy="19" r="${R}" fill="none" stroke="var(--signal)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"
          transform="rotate(-90 19 19)" style="transition:stroke-dashoffset .9s linear"/>
      </svg>
      <div><div class="dock-k">PAUZĂ</div>
      <div class="dock-v rest mono">${fmtTime(S.rest.left)}</div></div></div>`;
  }
  html+='<div class="dock-acts">';
  if(S.rest) html+=`<button class="btn ghost sm" data-act="restStop">Sari</button>`;
  if(S.sess) html+=`<button class="btn solid sm" data-act="sessStop">Termină</button>`;
  html+='</div></div>';
  d.innerHTML=html;
}

/* ---------- randare ---------- */
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>
    `<button class="tab ${S.tab===t[0]?'on':''}" data-act="tab" data-k="${t[0]}">${ic(t[2])} ${t[1]}</button>`).join('');
}
function renderPill(){
  const a=avgNote();
  document.getElementById('pillAvg').textContent=a==null?'fără test':'medie '+a.toFixed(2);
}
function render(){
  renderTabs(); renderPill();
  document.getElementById('view').innerHTML=VIEWS[S.tab]();
}

/* ---------- cronometru ---------- */
function beep(freq=1100,dur=.09){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur+.02);
  }catch(e){}
}
function timerPaint(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  const el=document.getElementById('tLeft'); if(!el) return;
  const totalP=T.phase==='work'?cfg.work:T.phase==='rest'?cfg.rest:T.phase==='prep'?cfg.prep:1;
  const frac=(T.phase==='idle'||T.phase==='done')?0:T.left/totalP;
  const C=2*Math.PI*100;
  const col=T.phase==='work'?'var(--signal)':T.phase==='rest'?'var(--ok)':T.phase==='done'?'var(--ok)':'var(--mute2)';
  el.textContent=fmtTime(T.left);
  const ring=document.getElementById('tRing');
  if(ring){ring.setAttribute('stroke-dashoffset',C*(1-frac));ring.setAttribute('stroke',col);}
  const ph=document.getElementById('tPhase');
  if(ph){ph.textContent={work:'EFORT',rest:'PAUZĂ',prep:'PREGĂTIRE',done:'GATA',idle:'STANDBY'}[T.phase];
    ph.style.color=col; ph.classList.toggle('pulsing',T.running&&T.phase==='work');}
  const rd=document.getElementById('tRound');
  if(rd) rd.textContent=(T.phase==='idle'||T.phase==='done')?cfg.rounds+' reprize':'repriza '+T.round+' / '+cfg.rounds;
}
function timerTick(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  if(T.left>1){ T.left--; if(T.left<=3) beep(880,.06); timerPaint(); return; }
  if(T.phase==='prep'){ T.phase='work'; T.left=cfg.work; T.round=1; beep(1320,.12); }
  else if(T.phase==='work'){
    if(T.round>=cfg.rounds){ T.phase='done'; T.left=0; T.running=false; stopTimer();
      beep(660,.12); setTimeout(()=>beep(520,.12),150); setTimeout(()=>beep(392,.25),300); render(); return; }
    T.phase='rest'; T.left=cfg.rest; beep(980,.08);
  } else if(T.phase==='rest'){ T.phase='work'; T.left=cfg.work; T.round++; beep(1320,.12); }
  timerPaint();
}
function startTimer(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
       if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
  if(T.phase==='idle'||T.phase==='done'){ T.phase='prep'; T.left=cfg.prep; T.round=0; }
  T.running=true; stopTimer(); tickHandle=setInterval(timerTick,1000); render();
}
function stopTimer(){ if(tickHandle){clearInterval(tickHandle);tickHandle=null;} }

/* ---------- acțiuni ---------- */
async function save(key,val,prop){ S[prop]=val; await store.set(key,val); }

document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, i=el.dataset.i, k=el.dataset.k, tk=todayKey();

  if(a==='tab'){ S.tab=k; render(); window.scrollTo({top:0}); return; }
  if(a==='phase'){ S.openPhase=S.openPhase===+i?-1:+i; render(); return; }
  if(a==='wblock'){ S.weekBlock=+i; render(); return; }
  if(a==='metric'){ S.metric=k; render(); return; }
  if(a==='pnote'){ S.paceNote=+i; render(); return; }
  if(a==='pweeks'){ S.paceWeeks=+i; render(); return; }

  if(a==='tpreset'){ S.timer={cfg:+i,phase:'idle',left:0,round:0,running:false}; stopTimer(); render(); return; }
  if(a==='tstart'){ startTimer(); return; }
  if(a==='tpause'){ S.timer.running=false; stopTimer(); render(); return; }
  if(a==='treset'){ S.timer={cfg:S.timer.cfg,phase:'idle',left:0,round:0,running:false}; stopTimer(); render(); return; }

  if(a==='gtgmax'){ const m=+document.getElementById('gtgMax').value;
    if(m>0) await save('zece:gtg',Object.assign({},S.gtg||{},{max:m,days:(S.gtg&&S.gtg.days)||{}}),'gtg');
    render(); return; }
  if(a==='gtgadd'){ const g=S.gtg||{}, days=Object.assign({},g.days||{});
    const t=Math.max(1,Math.round((g.max||0)*0.5));
    days[tk]=(days[tk]||[]).concat([t]);
    await save('zece:gtg',Object.assign({},g,{days}),'gtg'); render(); return; }
  if(a==='gtgdel'){ const g=S.gtg||{}, days=Object.assign({},g.days||{});
    days[tk]=(days[tk]||[]).filter((_,j)=>j!==+i);
    await save('zece:gtg',Object.assign({},g,{days}),'gtg'); render(); return; }

  if(a==='openday'){ S.openDay=S.openDay===+i?-1:+i; render(); return; }
  if(a==='ex'){ const x=el.dataset.x, log=Object.assign({},S.wlog||{});
    const day=Object.assign({},log[k]||{});
    if(day[x]) delete day[x]; else day[x]=1;
    log[k]=day; await save('zece:wlog',log,'wlog'); render(); return; }
  if(a==='rest'){ startRest(+el.dataset.r,el.dataset.x); render(); return; }
  if(a==='restStop'){ S.rest=null; ensureDock(); paintDock(); render(); return; }
  if(a==='sessStart'){ unlockAudio(); S.sess={date:k,start:Date.now()};
    await store.set('zece:sess',S.sess); ensureDock(); paintDock(); render(); return; }
  if(a==='sessStop'){
    if(S.sess){ const mins=Math.max(1,Math.round(sessElapsed()/60));
      const log=Object.assign({},S.wlog||{});
      log[S.sess.date]=Object.assign({},log[S.sess.date]||{},{__min:mins});
      S.sess=null; await store.set('zece:sess',null); await save('zece:wlog',log,'wlog'); }
    ensureDock(); render(); return; }
  if(a==='wreset'){ const mon=mondayOf(tk), log=Object.assign({},S.wlog||{});
    for(let n=0;n<7;n++){ const dk2=dayShift(mon,n), keep=(log[dk2]||{}).__min;
      if(keep) log[dk2]={__min:keep}; else delete log[dk2]; }
    await save('zece:wlog',log,'wlog'); render(); return; }

  if(a==='addTest'){
    const m=+document.getElementById('tM').value||0, s=+document.getElementById('tS').value||0;
    const sp=document.getElementById('tSp').value, pu=document.getElementById('tPu').value;
    const run=m*60+s;
    if(!run&&!sp&&!pu) return;
    const next=S.tests.concat([{date:tk,run:run||null,sprint:sp?+sp:null,pull:pu?+pu:null}]);
    await save('zece:tests',next,'tests'); render(); return; }
  if(a==='delTest'){ await save('zece:tests',S.tests.filter((_,j)=>j!==+i),'tests'); render(); return; }

  if(a==='logWo'){ const w=S.workouts||{}, entries=(w.entries||[]).concat([
      {eid:Date.now()+'-'+Math.random().toString(36).slice(2,6),sid:k,date:tk,note:''}]);
    await save('zece:workouts',Object.assign({},w,{entries}),'workouts'); render(); return; }
  if(a==='delWo'){ const w=S.workouts||{};
    await save('zece:workouts',Object.assign({},w,{entries:(w.entries||[]).filter(e=>e.eid!==k)}),'workouts');
    render(); return; }
});

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='paceM'){ S.paceM=t.value; refreshPace(); }
  if(t.id==='paceS'){ S.paceS=t.value; refreshPace(); }
});
let paceTimer=null;
function refreshPace(){ clearTimeout(paceTimer); paceTimer=setTimeout(()=>{ if(S.tab==='tools') render(); },600); }

document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.dataset && t.dataset.note){
    const w=S.workouts||{};
    const entries=(w.entries||[]).map(e=>e.eid===t.dataset.note?Object.assign({},e,{note:t.value}):e);
    await save('zece:workouts',Object.assign({},w,{entries}),'workouts');
  }
});

/* ---------- intro ---------- */
(function intro(){
  const el=document.getElementById('intro');
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const close=()=>{ if(!el.parentNode) return; el.classList.add('out'); setTimeout(()=>el.remove(),470); };
  setTimeout(close,reduced?700:2350);
  el.addEventListener('click',close);
})();

/* ---------- pornire ---------- */
(async function init(){
  render();
  const [t,g,l,w]=await Promise.all([store.get('zece:tests'),store.get('zece:gtg'),
    store.get('zece:wlog'),store.get('zece:workouts')]);
  if(Array.isArray(t)) S.tests=t;
  if(g) S.gtg=g; if(l) S.wlog=l; if(w) S.workouts=w;
  const sv=await store.get('zece:sess'); if(sv&&sv.start) S.sess=sv;
  const tkNow=todayKey(); S.openDay=Array.from({length:7},(_,n)=>dayShift(mondayOf(tkNow),n)).indexOf(tkNow);
  ensureDock(); paintDock();
  const last=latestFull();
  if(last&&last.run){ S.paceM=Math.floor(last.run/60); S.paceS=last.run%60; }
  render();
})();
